background {
    monitor =
    path = screenshot

    blur_passes = 3          # higher = blurrier (try 2–5)
    blur_size   = 8          # bigger kernel, broader smear

    noise       = 0.01       # subtle grain — keeps blur from looking plasticky
    contrast    = 0.9
    brightness  = 0.7        # darken a bit so the clock pops over the top
    vibrancy    = 0.17
    vibrancy_darkness = 0.05
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 1
    inner_color = rgba(1a1d23ff)
    outer_color = rgba(2a2f38ff)
    check_color = rgba(66d9efff)
    fail_color = rgba(f92672ff)
    font_color = rgba(c8ccd4ff)
    font_family = JetBrainsMono Nerd Font
    placeholder_text = <i>password</i>
    fade_on_empty = false
    position = 0, -100
    halign = center
    valign = center
}

# Big clock
label {
    monitor =
    text = cmd[update:1000] date '+%H:%M'
    color = rgba(eef0f4ff)
    font_size = 120
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 200
    halign = center
    valign = center
}

# Date underneath
label {
    monitor =
    text = cmd[update:60000] date '+%A, %d %B %Y'
    color = rgba(c8ccd4ff)
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, 80
    halign = center
    valign = center
}
