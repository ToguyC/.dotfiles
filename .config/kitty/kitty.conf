font_family      IosevkaTerm Nerd Font
bold_font        IosevkaTerm Nerd Font Bold
italic_font      IosevkaTerm Nerd Font Italic
bold_italic_font IosevkaTerm Nerd Font Bold Italic
bold_font        auto
italic_font      auto
font_size        13

# Match the bar palette
background           #0f1114
foreground           #c8ccd4
cursor               #66d9ef
selection_background #1a1d23
selection_foreground #eef0f4

window_padding_width 6
background_opacity   1.0
hide_window_decorations yes     # Hyprland gives the border; kitty should be pure content

# Tabs like tmux
tab_bar_style powerline
tab_powerline_style slanted
tab_bar_edge bottom
